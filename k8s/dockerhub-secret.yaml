# This file is documentation/reference only.
# Do NOT apply with `kubectl apply -f`. It contains no credentials.
# To create the actual secret, run the command in the `generate-it` annotation.
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
  namespace: tekton-pipelines
  annotations:
    description: "Credentials to push images to Docker Hub from Tekton pipelines"
    permissions: "Read-write for image push"
    created-at: "2026-06-20"
    expires-at: "rotate-manually"
    generate-it: |
      kubectl create secret docker-registry dockerhub-secret \
        -n tekton-pipelines \
        --docker-server=https://index.docker.io/v1/ \
        --docker-username=<your-username> \
        --docker-password=<your-password-or-token> \
        --dry-run=client -o yaml > k8s/dockerhub-secret.yaml
type: kubernetes.io/dockerconfigjson
# This file is documentation/reference only.
# Do NOT apply with `kubectl apply -f`. It contains no credentials.
# To create the actual secret, run the command in the `generate-it` annotation.
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: tekton-pipelines
  annotations:
    description: "Shared secret used by the GitHub interceptor to validate webhook payload signatures (X-Hub-Signature-256)"
    permissions: "Read-only, used for HMAC signature verification"
    created-at: "2026-06-11"
    expires-at: "rotate-manually"
    generate-it: |
      kubectl create secret generic github-webhook-secret \
        -n tekton-pipelines \
        --from-literal=secretToken=<your-random-secret-token> \
        --dry-run=client -o yaml > k8s/github-webhook-secret.yaml
type: Opaque
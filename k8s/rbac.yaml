apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipeline-sa
  namespace: tekton-pipelines
secrets:
  - name: registry-cert
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["deployments", "pods", "services"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "tasks"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: tekton-pipeline-sa
    namespace: tekton-pipelines
roleRef:
  kind: Role
  name: pipeline-role
  apiGroup: rbac.authorization.k8s.io
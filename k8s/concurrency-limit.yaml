apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-concurrency-limit
  namespace: tekton-pipelines
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pipeline-quota
  namespace: tekton-pipelines
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"

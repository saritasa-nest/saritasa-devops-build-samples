# components.yaml
#
# Single source of truth for the CI/CD pipeline.
# Each entry registers one buildpack-ready component for automated build and deploy.
#
# Fields:
#   id        - Unique slug used as the Kubernetes Deployment name and image repository name.
#   path      - Directory prefix relative to the repo root used for change detection.
#               A webhook commit touching any file under this path triggers a build.
#   builder   - Paketo builder image passed to `pack build --builder`.
#   build_env - Optional list of `--env KEY=VALUE` pairs forwarded to `pack build`.
#               Use to override buildpack-detected behaviour (e.g. set entry point targets).
#   port      - Container port exposed by the application, used when creating the Deployment.

components:
  - id: go-no-imports
    path: go/no-imports
    builder: paketobuildpacks/builder-jammy-base
    build_env:
      - BP_GO_TARGETS=.
    port: 8080

  - id: go-mod
    path: go/mod
    builder: paketobuildpacks/builder-jammy-base
    build_env:
      - BP_GO_TARGETS=.
    port: 8080

  - id: python-pip
    path: python/pip
    builder: paketobuildpacks/builder-jammy-base
    build_env: []
    port: 8080

  - id: python-poetry
    path: python/poetry
    builder: paketobuildpacks/builder-jammy-base
    build_env: []
    port: 8080

  - id: nodejs-npm
    path: nodejs/npm
    builder: paketobuildpacks/builder-jammy-base
    build_env: []
    port: 8080

  - id: nodejs-yarn
    path: nodejs/yarn
    builder: paketobuildpacks/builder-jammy-base
    build_env: []
    port: 8080

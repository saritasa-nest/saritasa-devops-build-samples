apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clean-up
  namespace: saritasa-devops-project
spec:
  description: A task to clean up resources spun up from this PipelineRun and its descending PipelineRuns

  params:
    - name: source-directory
      description: Subdirectory to contain source code
      type: string
      default: ""
    - name: github-webhook-secret-name
      description: Name of Github webhook's K8S secret
      type: string
      default: ""
    - name: pipeline-role
      description: Role of current pipeline (orchestrator/component)
      type: string
      default: "orchestrator"

  workspaces:
    - name: source
      description: Workspace containing this repository's source code

  steps:
    - name: clean-up-source-directory
      image: alpine/k8s:1.33.13
      when:
        input: "$(params.pipeline-role)"
        operator: in
        values: ["component"]
      script: |
        #!/bin/bash
        set -eu

        SOURCE_DIR="$(workspaces.source.path)/$(params.source-directory)"

        RUNNING_BUILDS=$(kubectl get pipelineruns -n $PARENT_NAMESPACE \
          -l tekton.dev/pipeline=build-deploy-single-component \
          -o json 2>/dev/null \
          | jq --arg revision "$REVISION" '.items[] | select(.metadata.annotations["saritasa.tekton.dev/commit-sha"] == $revision) | select(.status.conditions[0].reason == "Running") | .metadata.name' \
          | wc -l)

        if [ "$RUNNING_BUILDS" -ne 1 ]; then
          echo "There are still running builds, skipping clean up."
          exit 0
        fi

        echo "Cleaning up source workspace..."

        if [ -d "$SOURCE_DIR" ]; then
          rm -rf "$SOURCE_DIR"/*
        else
          rm -rf "$(workspaces.source.path)"/*
        fi

    - name: clean-up-webhook-secret
      image: alpine/k8s:1.33.13
      when:
        input: "$(params.pipeline-role)"
        operator: in
        values: ["orchestrator"]
      script: |
        #!/bin/bash
        set -eu

        # Github webhook secret
        echo "Removing Github webhook secret..."
        kubectl delete secret "$(params.github-webhook-secret-name)" --ignore-not-found -n $(kubectl get repository -A -o jsonpath='{.items[0].metadata.namespace}')

        
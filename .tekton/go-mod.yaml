apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: go-mod-
  namespace: tekton
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
    saritasa.dev/component: go-mod
    saritasa.dev/pipeline-role: build-deploy
  annotations:
    pipelinesascode.tekton.dev/on-event:        "[push, pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main, feat/*]"
    pipelinesascode.tekton.dev/on-path-change:  "[go/mod/**, .tekton/go-mod.yaml]"
    pipelinesascode.tekton.dev/max-keep-runs:   "5"
    pipelinesascode.tekton.dev/task:         "[https://raw.githubusercontent.com/tektoncd/catalog/main/task/git-clone/0.9/git-clone.yaml, https://raw.githubusercontent.com/tektoncd/catalog/main/task/kubernetes-actions/0.2/kubernetes-actions.yaml]"
spec:
  pipelineRef:
    name: component-delivery
  serviceAccountName: pipeline-sa
  params:
    - name: component-id
      value: go-mod
    - name: source-subpath
      value: go/mod
    - name: image-ref
      value: ghcr.io/dknhat2000/go-mod:{{ revision }}
    - name: commit-sha
      value: "{{ revision }}"
    - name: repo-url
      value: "{{ repo_url }}"
    - name: builder
      value: paketobuildpacks/builder-jammy-base
    - name: build-env
      value:
        - BP_GO_TARGETS=.
    - name: process-type
      value: ""
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: dockerconfig
      secret:
        secretName: ghcr-credentials
        items:
          - key: .dockerconfigjson
            path: config.json

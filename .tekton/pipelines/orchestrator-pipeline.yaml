apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: orchestrator-pipeline
  namespace: saritasa-devops-project
spec:
  description: |
    This pipeline detects changes in subprojects and orchestrates build to deploy updated components.

  params:
    - name: repo-url
      description: The repo URL where Git will clone
      type: string
    - name: revision
      description: Repo's commit SHA
      type: string
    - name: image-repository
      description: Docker image repository URL
      type: string
      default: "docker.io/library"

  workspaces:
    - name: source
      description: Workspace containing this repository's source code
    - name: basic-auth
      description: Git credentials
    
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "$(params.repo-url)"
        - name: revision
          value: "$(params.revision)"
        - name: depth
          value: "0"
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: detect-changed-components
      taskRef:
        name: detect-changed-components
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: source

    - name: create-tekton-resources
      taskRef:
        name: create-tekton-resources
      runAfter:
        - detect-changed-components
      workspaces:
        - name: source
          workspace: source

    - name: build-deploy-changed-components
      taskRef:
        name: trigger-components-build
      runAfter:
        - create-tekton-resources
      params:
        - name: repo-url
          value: "$(params.repo-url)"
        - name: revision
          value: "$(params.revision)"
        - name: changed-components
          value: "$(tasks.detect-changed-components.results.changed-dirs)"
        - name: max-concurrent-builds
          value: "3"
        - name: template-filepath
          value: ".tekton/templates/component-build-run-template.yaml"
        - name: pipeline-namespace
          value: "saritasa-devops-project"
        - name: image-repository
          value: "$(params.image-repository)"
      workspaces:
        - name: source
          workspace: source
      
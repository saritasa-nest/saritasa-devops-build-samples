apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: orchestrator-pipeline
spec:
  description: |
    This pipeline detects changes in subprojects and orchestrates build to deploy updated components.

  params:
    - name: repo-url
      description: The repo URL where Git will clone
      type: string
    - name: revision
      description: Repo's commit SHA
      type: string
    - name: base-revision
      description: Optional base commit SHA used to detect changed files across a push range
      type: string
      default: ""
    - name: image-repository
      description: Docker image repository URL
      type: string
      default: "docker.io/library"
    - name: component-pipeline-max-concurrent-build
      description: Maximum concurrent build for component pipeline
      type: string
      default: "3"
    - name: github-webhook-secret-name
      description: GitHub webhook secret name
      type: string

  workspaces:
    - name: source
      description: Workspace containing this repository's source code
    - name: basic-auth
      description: Git credentials
    
  tasks:
    - name: fetch-repository
      displayName: Git clone source repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "$(params.repo-url)"
        - name: revision
          value: "$(params.revision)"
        - name: depth
          value: "0"
        - name: deleteExisting
          value: "true"
        - name: subdirectory
          value: "$(params.revision)"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: create-tekton-resources
      displayName: Create Tekton resources
      taskRef:
        name: create-tekton-resources
      runAfter:
        - fetch-repository
      params:
        - name: source-directory
          value: "$(params.revision)"
      workspaces:
        - name: source
          workspace: source

    - name: detect-changed-components
      displayName: Detect subprojects with changes
      taskRef:
        name: detect-changed-components
      runAfter:
        - fetch-repository
      params:
        - name: base-revision
          value: "$(params.base-revision)"
        - name: source-directory
          value: "$(params.revision)"
      workspaces:
        - name: source
          workspace: source

    - name: build-deploy-changed-components
      displayName: Trigger pipeline to build & deploy subprojects
      taskRef:
        name: trigger-components-build
      runAfter:
        - detect-changed-components
        - create-tekton-resources
      params:
        - name: repo-url
          value: "$(params.repo-url)"
        - name: revision
          value: "$(params.revision)"
        - name: changed-components
          value: "$(tasks.detect-changed-components.results.changed-dirs)"
        - name: max-concurrent-builds
          value: "$(params.component-pipeline-max-concurrent-build)"
        - name: template-filepath
          value: ".tekton/templates/component-build-run-template.yaml"
        - name: pipeline-namespace
          value: "saritasa-devops-project"
        - name: image-repository
          value: "$(params.image-repository)"
        - name: source-directory
          value: "$(params.revision)"
      workspaces:
        - name: source
          workspace: source

  finally:
    - name: clean-up
      displayName: "Clean up resources"
      taskRef:
        name: clean-up
      params:
        - name: source-directory
          value: "$(params.revision)"
        - name: github-webhook-secret-name
          value: "$(params.github-webhook-secret-name)"
        - name: pipeline-role
          value: "orchestrator"
      workspaces:
        - name: source
          workspace: source
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-project
  namespace: saritasa-devops-project
spec:
  params:
    - name: repo_url
      description: The repo URL where Git will clone
      type: string
    - name: revision
      description: Repo's commit SHA
      type: string
    - name: git-auth-secret-name
      description: Name of Kubernetes secret holding Git credentials
      type: string
    - name: image-registry
      description: Docker image registry URL
      type: string
      default: "docker.io"

  workspaces:
    - name: source
    - name: basic-auth
    
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "$(params.repo_url)"
        - name: revision
          value: "$(params.revision)"
        - name: depth
          value: "0"
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: detect-changed-components
      taskRef:
        name: detect-changed-components
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: source

    - name: create-tekton-resources
      taskRef:
        name: create-tekton-resources
      runAfter:
        - detect-changed-components
      workspaces:
        - name: source
          workspace: source

    - name: build-deploy-changed-components
      taskRef:
        name: trigger-components-build
      runAfter:
        - create-tekton-resources
      params:
        - name: repo-url
          value: "$(params.repo_url)"
        - name: revision
          value: "$(params.revision)"
        - name: git-auth-secret-name
          value: "$(params.git-auth-secret-name)"
        - name: changed-components
          value: "$(tasks.detect-changed-components.results.changed-dirs)"
        - name: max-concurrent-builds
          value: "3"
        - name: template-filepath
          value: ".tekton/templates/component-build-run-template.yaml"
        - name: pipeline-namespace
          value: "saritasa-devops-project"
        - name: image-registry
          value: "$(params.image-registry)"
      workspaces:
        - name: source
          workspace: source
      
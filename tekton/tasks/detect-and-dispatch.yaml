apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: detect-and-dispatch
  namespace: tekton
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
  annotations:
    saritasa.dev/source: custom
spec:
  description: >-
    Match webhook changed paths against components.yaml and create one
    build-deploy-component PipelineRun per matched component, with concurrency
    control from ConfigMap build-config. Prints NOOP when nothing matches.
  workspaces:
    - name: components
      optional: true
      description: Directory containing components.yaml (alternative to components-yaml param)
  params:
    - name: commit-sha
      type: string
      description: Git commit SHA from the webhook (body.after)
    - name: changed-files
      type: string
      description: Space-separated list of changed file paths
    - name: repo-url
      type: string
      description: SSH or HTTPS clone URL for the repository
    - name: components-yaml
      type: string
      description: Full components.yaml content (used when components workspace is not bound)
      default: ""
  steps:
    - name: detect-and-dispatch
      image: python:3.12-slim-bookworm
      env:
        - name: COMMIT_SHA
          value: $(params.commit-sha)
        - name: CHANGED_FILES
          value: $(params.changed-files)
        - name: REPO_URL
          value: $(params.repo-url)
        # Used to construct the GHCR image ref: ghcr.io/<GITHUB_USER>/<component-id>:<sha>
        - name: GITHUB_USER
          valueFrom:
            configMapKeyRef:
              name: build-config
              key: GITHUB_USER
        - name: COMPONENTS_YAML
          value: $(params.components-yaml)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install -q pyyaml kubernetes >/dev/null
        python3 <<'PY'
        import os
        import sys
        import time

        import yaml
        from kubernetes import client, config
        from kubernetes.client.rest import ApiException

        commit_sha = os.environ["COMMIT_SHA"]
        changed_files = os.environ["CHANGED_FILES"].split()
        repo_url = os.environ["REPO_URL"]
        github_user = os.environ["GITHUB_USER"]
        short_sha = commit_sha[:7]
        namespace = "tekton"

        components_yaml = os.environ.get("COMPONENTS_YAML", "").strip()
        components_path = "/workspace/components/components.yaml"
        if not components_yaml and os.path.isfile(components_path):
            with open(components_path, encoding="utf-8") as fh:
                components_yaml = fh.read()
        if not components_yaml:
            print("ERROR: components.yaml not provided via param or workspace", file=sys.stderr)
            sys.exit(1)

        data = yaml.safe_load(components_yaml) or {}
        components = data.get("components") or []

        def path_matches(prefix: str, changed: str) -> bool:
            return changed == prefix or changed.startswith(prefix + "/")

        matched = []
        for comp in components:
            prefix = comp.get("path", "")
            if not prefix:
                continue
            if any(path_matches(prefix, f) for f in changed_files):
                matched.append(comp)

        if not matched:
            print("NOOP")
            sys.exit(0)

        print(f"Matched {len(matched)} component(s): {', '.join(c['id'] for c in matched)}")

        config.load_incluster_config()
        core = client.CoreV1Api()
        tekton = client.CustomObjectsApi()

        try:
            cm = core.read_namespaced_config_map("build-config", namespace)
            max_concurrent = int(cm.data.get("MAX_CONCURRENT_BUILDS", "2"))
        except ApiException:
            max_concurrent = 2

        def running_build_count() -> int:
            result = tekton.list_namespaced_custom_object(
                group="tekton.dev",
                version="v1beta1",
                namespace=namespace,
                plural="pipelineruns",
                label_selector="saritasa.dev/pipeline-role=build-deploy",
            )
            running = 0
            for item in result.get("items", []):
                conditions = item.get("status", {}).get("conditions", [])
                done = any(
                    c.get("type") == "Succeeded" and c.get("status") in ("True", "False")
                    for c in conditions
                )
                if not done:
                    running += 1
            return running

        def wait_for_slot() -> None:
            while running_build_count() >= max_concurrent:
                print(
                    f"Concurrency limit ({max_concurrent}): "
                    f"{running_build_count()} running, waiting..."
                )
                time.sleep(10)

        docker_items = [{"key": ".dockerconfigjson", "path": "config.json"}]

        for comp in matched:
            wait_for_slot()
            comp_id = comp["id"]
            image_ref = f"ghcr.io/{github_user}/{comp_id}:{short_sha}"
            build_env = comp.get("build_env") or []
            port = str(comp.get("port", 8080))

            pr = {
                "apiVersion": "tekton.dev/v1beta1",
                "kind": "PipelineRun",
                "metadata": {
                    "generateName": f"build-deploy-{comp_id}-",
                    "namespace": namespace,
                    "labels": {
                        "saritasa.dev/pipeline-role": "build-deploy",
                        "saritasa.dev/component": comp_id,
                    },
                },
                "spec": {
                    "pipelineRef": {"name": "build-deploy-component"},
                    "serviceAccountName": "pipeline-sa",
                    "params": [
                        {"name": "component-id", "value": comp_id},
                        {"name": "source-subpath", "value": comp["path"]},
                        {"name": "image-ref", "value": image_ref},
                        {"name": "commit-sha", "value": commit_sha},
                        {"name": "repo-url", "value": repo_url},
                        {"name": "builder", "value": comp["builder"]},
                        {"name": "build-env", "value": build_env},
                        {"name": "port", "value": port},
                    ],
                    "workspaces": [
                        {
                            "name": "source",
                            "volumeClaimTemplate": {
                                "spec": {
                                    "accessModes": ["ReadWriteOnce"],
                                    "resources": {"requests": {"storage": "2Gi"}},
                                },
                            },
                        },
                        {
                            "name": "git-credentials",
                            "secret": {"secretName": "git-credentials"},
                        },
                        {
                            "name": "dockerconfig",
                            "secret": {
                                "secretName": "ghcr-credentials",
                                "items": docker_items,
                            },
                        },
                    ],
                },
            }

            tekton.create_namespaced_custom_object(
                group="tekton.dev",
                version="v1beta1",
                namespace=namespace,
                plural="pipelineruns",
                body=pr,
            )
            print(f"Created PipelineRun for {comp_id} -> {image_ref}")
        PY

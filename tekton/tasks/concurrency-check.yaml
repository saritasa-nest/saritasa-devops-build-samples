apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: concurrency-check
spec:
  description: Wait until the number of running PipelineRuns is below the configured limit.
  params:
    - name: max_concurrent
      type: string
      default: "2"
      description: Maximum concurrent PipelineRuns allowed.
    - name: namespace
      type: string
      default: tekton-pipelines
      description: Namespace where component PipelineRuns are created.
  steps:
    - name: check
      image: alpine/k8s:1.33.13
      script: |
        #!/bin/sh
        set -eu

        max_concurrent="$(params.max_concurrent)"
        namespace="$(params.namespace)"

        while true; do
          running=$(kubectl get pipelineruns -n "$namespace" -o json 2>/dev/null | \
            jq '[.items[] | select([.status.conditions[]?.status == "Unknown"] | any)] | length' 2>/dev/null || echo "0")

          if [ -z "$running" ]; then
            running=0
          fi

          if [ "$running" -lt "$max_concurrent" ]; then
            echo "Concurrency check passed: $running/$max_concurrent PipelineRuns running in namespace $namespace"
            exit 0
          fi

          echo "Concurrency limit reached ($running/$max_concurrent) in namespace $namespace; waiting before starting this component build"
          sleep 10
        done
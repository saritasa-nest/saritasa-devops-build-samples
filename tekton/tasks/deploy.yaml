apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
  namespace: tekton
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
  annotations:
    saritasa.dev/source: custom
spec:
  description: >-
    Patch a Deployment with a new image and wait for rollout. Logic lives in
    tekton/scripts/deploy.py (executed from the shared source workspace).
  params:
    - name: component-id
      type: string
      description: Deployment name to patch (matches the component slug)
    - name: image-ref
      type: string
      description: Full image reference to roll out (ghcr.io/<user>/<id>:<sha>)
    - name: namespace
      type: string
      description: Kubernetes namespace containing the Deployment
      default: tekton
    - name: rollout-timeout
      type: string
      description: Rollout wait timeout in seconds
      default: "300"
  workspaces:
    - name: source
      description: Shared pipeline workspace containing the cloned repo and scripts
  steps:
    - name: deploy
      image: python:3.12-slim-bookworm
      env:
        - name: COMPONENT_ID
          value: $(params.component-id)
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: NAMESPACE
          value: $(params.namespace)
        - name: ROLLOUT_TIMEOUT
          value: $(params.rollout-timeout)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install -q kubernetes >/dev/null
        exec python3 $(workspaces.source.path)/tekton/scripts/deploy.py

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: detect-components
spec:
  description: Detect modified buildpack-ready components between commits
  params:
    - name: old_sha
      type: string
      description: Previous commit SHA
    - name: new_sha
      type: string
      description: New commit SHA
  workspaces:
    - name: source
      description: Repository source code
  results:
    - name: components
      description: Space-separated list of modified components
  steps:
    - name: detect
      image: alpine/git:v2.54.0@sha256:113d99116e236f93f0b1f53cd46dbda662cf1136d20dc9ae2834962226654d9f
      script: |
        #!/bin/sh
        set -euo pipefail
        cd $(workspaces.source.path)
        old_sha="$(params.old_sha)"
        new_sha="$(params.new_sha)"
        
        CHANGED_FILES=$(git diff --name-only "$old_sha" "$new_sha" 2>/dev/null || true)
        
        if [ -z "$CHANGED_FILES" ]; then
          echo "no-op: no changes detected between $old_sha and $new_sha"
          echo -n "no-op" > $(results.components.path)
          exit 0
        fi
        
        COMPONENTS=$(echo "$CHANGED_FILES" | \
          cut -d'/' -f1-2 | \
          sort -u | \
          grep -v '^scripts$' | \
          grep -v '^tests$' | \
          grep -v '^kustomize$' | \
          grep -v '^kubernetes$' | \
          grep -v '^docker$' | \
          grep -v '^git$' | \
          grep -v '^procfile$' | \
          grep -v '^ca-certificates$' || true)
        
        if [ -z "$COMPONENTS" ]; then
          echo "no-op: no buildpack-ready components modified"
          echo -n "no-op" > $(results.components.path)
          exit 0
        fi
        
        echo "Modified components: $COMPONENTS"
        echo -n "$COMPONENTS" > $(results.components.path)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: el-github-listener-sa
  namespace: tekton
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: el-github-listener-role
  namespace: tekton
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
  - apiGroups: ["triggers.tekton.dev"]
    resources:
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
      - interceptors
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: el-github-listener-rolebinding
  namespace: tekton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: el-github-listener-role
subjects:
  - kind: ServiceAccount
    name: el-github-listener-sa
    namespace: tekton
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: el-github-listener-clusterrole
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors", "clustertriggerbindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: el-github-listener-clusterrolebinding
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: el-github-listener-clusterrole
subjects:
  - kind: ServiceAccount
    name: el-github-listener-sa
    namespace: tekton

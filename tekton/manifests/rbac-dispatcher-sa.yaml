apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher-sa
  namespace: tekton
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher-role
  namespace: tekton
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher-rolebinding
  namespace: tekton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher-role
subjects:
  - kind: ServiceAccount
    name: dispatcher-sa
    namespace: tekton

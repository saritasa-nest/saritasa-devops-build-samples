apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-role-dev
  namespace: dev
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-rolebinding-dev
  namespace: dev
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-role-dev
subjects:
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: tekton

apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: clone-build-test
  namespace: tekton
spec:
  pipelineRef:
    name: clone-build-test
  params:
    - name: repo-url
      value: git@github.com:dknhat2000/saritasa-devops-build-samples.git
    - name: commit-sha
      value: 48097e2cd32d34b66e06bc26d362defe418b33ed
    - name: source-subpath
      value: go/no-imports
    - name: builder-image
      value: paketobuildpacks/builder-jammy-base
    - name: app-image
      value: ghcr.io/dknhat2000/go-no-imports:48097e2
    - name: build-env
      value:
        - BP_GO_TARGETS=.
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: clone-build-source-pvc
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: dockerconfig
      secret:
        secretName: ghcr-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
  podTemplate:
    securityContext:
      fsGroup: 1000

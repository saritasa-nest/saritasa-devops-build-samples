apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: dispatcher
  namespace: tekton
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
  annotations:
    saritasa.dev/source: custom
spec:
  description: >-
    Receive a GitHub push event and fan out to one build-deploy-component
    PipelineRun per changed component. Changed paths are matched against
    components.yaml (mounted from the components-config ConfigMap).
    Concurrency is capped by MAX_CONCURRENT_BUILDS in build-config.
  params:
    - name: commit-sha
      type: string
      description: Git commit SHA from the push event (body.after)
    - name: changed-files
      type: string
      description: Space-separated list of changed file paths from the webhook
    - name: repo-url
      type: string
      description: SSH clone URL of the repository
    - name: repo-name
      type: string
      description: Repository name (informational)
  workspaces:
    - name: components
      optional: true
      description: >-
        ConfigMap-backed workspace providing components.yaml.
        Bound to the components-config ConfigMap by the TriggerTemplate.
  tasks:
    - name: detect-and-dispatch
      taskRef:
        name: detect-and-dispatch
      workspaces:
        - name: components
          workspace: components
      params:
        - name: commit-sha
          value: $(params.commit-sha)
        - name: changed-files
          value: $(params.changed-files)
        - name: repo-url
          value: $(params.repo-url)

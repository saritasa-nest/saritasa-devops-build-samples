apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-and-deploy
spec:
  description: Clone repo, build with Paketo, and deploy to Kubernetes.
  params:
    - name: git_url
      type: string
      description: Git repository URL to clone.
    - name: git_revision
      type: string
      default: main
      description: Git revision to checkout.
    - name: component_path
      type: string
      default: ""
      description: Subdirectory path within repo, for example nodejs/npm.
    - name: image
      type: string
      description: Full image reference to publish, for example docker.io/lbcristaldo/component:sha-abc123.
    - name: builder_image
      type: string
      description: Buildpack builder image reference for the Paketo lifecycle.
    - name: deployment_name
      type: string
      description: Name of the deployment to update.
    - name: namespace
      type: string
      default: default
      description: Target namespace for deployment.
    - name: max_concurrent
      type: string
      default: "2"
      description: Max concurrent component builds.
    - name: pipeline_namespace
      type: string
      default: tekton-pipelines
      description: Namespace where this PipelineRun is running.
  workspaces:
    - name: source
      description: Shared workspace for source code.
    - name: docker-config
      description: Non-optional Docker Hub dockerconfigjson secret.
    - name: cache
      description: Optional workspace for buildpacks cache.
      optional: true
  tasks:
    - name: concurrency-check
      taskRef:
        name: concurrency-check
      params:
        - name: max_concurrent
          value: $(params.max_concurrent)
        - name: namespace
          value: $(params.pipeline_namespace)
    - name: clone
      taskRef:
        name: git-clone
      runAfter:
        - concurrency-check
      params:
        - name: url
          value: $(params.git_url)
        - name: revision
          value: $(params.git_revision)
        - name: subdirectory
          value: $(params.component_path)
      workspaces:
        - name: source
          workspace: source
    - name: build
      taskRef:
        name: buildpacks-creator
      runAfter:
        - clone
      params:
        - name: image
          value: $(params.image)
        - name: component_path
          value: $(params.component_path)
        - name: builder_image
          value: $(params.builder_image)
      workspaces:
        - name: source
          workspace: source
        - name: docker-config
          workspace: docker-config
        - name: cache
          workspace: cache
    - name: patch
      taskRef:
        name: patch-deployment
      runAfter:
        - build
      params:
        - name: deployment_name
          value: $(params.deployment_name)
        - name: image
          value: $(params.image)
        - name: namespace
          value: $(params.namespace)
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-deploy-component
  namespace: tekton
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
  annotations:
    saritasa.dev/source: custom
spec:
  description: >-
    Clone a single component at a commit SHA, build it with Paketo buildpacks,
    push the image to GHCR, patch the Kubernetes Deployment, and notify stdout.
    Created by detect-and-dispatch — one PipelineRun per changed component.
  params:
    - name: component-id
      type: string
      description: Component slug matching the Deployment name (e.g. go-no-imports)
    - name: source-subpath
      type: string
      description: Directory within the repo containing the component (e.g. go/no-imports)
    - name: image-ref
      type: string
      description: Full image reference to build and deploy (ghcr.io/<user>/<id>:<sha>)
    - name: commit-sha
      type: string
      description: Git commit SHA to clone and build
    - name: repo-url
      type: string
      description: SSH clone URL of the repository
    - name: builder
      type: string
      description: Paketo builder image
      default: paketobuildpacks/builder-jammy-base
    - name: build-env
      type: array
      description: Build-time environment variables forwarded to pack (KEY=VALUE list)
      default: []
    - name: port
      type: string
      description: Container port exposed by the application (informational)
      default: "8080"
  workspaces:
    - name: source
      description: PVC shared between the clone and build steps
    - name: git-credentials
      description: Secret containing the SSH key for git-clone
    - name: dockerconfig
      description: Secret containing the Docker config for pushing to GHCR
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source
        - name: ssh-directory
          workspace: git-credentials
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.commit-sha)
        - name: submodules
          value: "false"
        - name: depth
          value: "1"

    - name: build
      runAfter: ["clone"]
      taskRef:
        name: pack-build-push
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: APP_IMAGE
          value: $(params.image-ref)
        - name: BUILDER_IMAGE
          value: $(params.builder)
        - name: SOURCE_SUBPATH
          value: $(params.source-subpath)
        - name: ENV_VARS
          value: $(params.build-env[*])
        # Run as root so the CNB lifecycle can chown layers; it applies -uid/-gid internally.
        - name: USER_ID
          value: "0"
        - name: GROUP_ID
          value: "0"

    - name: deploy
      runAfter: ["build"]
      taskRef:
        name: deploy
      workspaces:
        - name: source
          workspace: source
      params:
        - name: component-id
          value: $(params.component-id)
        - name: image-ref
          value: $(params.image-ref)

  # finally always runs regardless of task success or failure,
  # ensuring notifications and GitHub status are posted on every outcome.
  finally:
    - name: notify
      taskRef:
        name: notify
      workspaces:
        - name: source
          workspace: source
      params:
        - name: component-id
          value: $(params.component-id)
        - name: status
          value: $(tasks.aggregate-status)
        - name: image-ref
          value: $(params.image-ref)
        - name: commit-sha
          value: $(params.commit-sha)

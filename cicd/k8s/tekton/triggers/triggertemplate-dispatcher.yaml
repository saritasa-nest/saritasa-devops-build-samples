apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: dispatcher-template
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: saritasa-cicd
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: changed-files
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: dispatcher-
        namespace: cicd
        labels:
          tekton.dev/pipeline: dispatcher
          triggers.tekton.dev/trigger: github-push
      spec:
        serviceAccountName: dispatcher-sa
        pipelineRef:
          name: dispatcher
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: changed-files
            value: $(tt.params.changed-files)
        workspaces:
          - name: components
            configMap:
              name: components-registry
        timeouts:
          pipeline: 60m
